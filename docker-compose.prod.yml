services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  backend:
    # El nombre ghcr.io/... es heredado: las imágenes ya NO se suben a un
    # registry. scripts/deploy-prod.sh las ensambla en la caja con este mismo
    # tag, así que compose las encuentra locales. pull_policy: never lo hace
    # explícito — sin él, un tag ausente manda a compose a GHCR, que en repo
    # privado se cobra y encima fallaría sin credencial.
    image: ghcr.io/sssamuelll/klara-backend:${IMAGE_TAG:-latest}
    pull_policy: never
    build: !reset {}
    environment:
      APP_ENV: production
      CORS_ORIGINS: "https://klara.sdar.dev"
      FRONTEND_BASE_URL: "https://klara.sdar.dev"
      BACKEND_BASE_URL: "https://klara.sdar.dev"
    ports: !override
      - "127.0.0.1:8210:8000"
    volumes: !reset []
    # --ws-ping-*: keepalive for /pronunciation/stream (dead clients dropped
    # by uvicorn -> session receiver raises -> teardown -> client falls to batch).
    command: ["sh", "-c", "alembic upgrade head && uvicorn klara.main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 10 --ws-ping-timeout 10"]

  frontend:
    image: ghcr.io/sssamuelll/klara-frontend:${IMAGE_TAG:-latest}
    pull_policy: never
    build: !reset {}
    environment: !reset {}
    ports: !override
      - "127.0.0.1:8211:80"
    volumes: !reset []
