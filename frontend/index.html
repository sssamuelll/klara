    <!-- El japonés (spec 2026-10-09 §5.7) va aparte del @import de global.css y sin bloquear el
         primer pintado: se pide como `print` y pasa a `all` al cargar. Las páginas en latín no
         descargan ni un trozo de la fuente; solo el texto con `lang="ja"` (tokens.css) los pide. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400..600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400..600&display=swap" /></noscript>
